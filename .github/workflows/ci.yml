name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test + health check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Bật DB trước để tranh thủ lúc build (SQL Server khởi động khá lâu)
      - name: Start databases
        # MongoDB 8.x không chạy được trên kernel Linux 6.19+ của runner GitHub (SERVER-121912)
        # → riêng CI dùng mongo:7.0; máy local vẫn dùng mongo:8.0 trong docker-compose
        run: |
          docker compose up -d sqlserver postgres
          docker run -d --name swiftride-mongodb -p 27018:27017 mongo:7.0

      - name: Restore
        run: dotnet restore SwiftRide.sln

      - name: Build
        run: dotnet build SwiftRide.sln --no-restore -c Release

      - name: Test
        run: dotnet test SwiftRide.sln --no-build -c Release

      # Service tự migrate lúc khởi động → phải chờ DB sẵn sàng, không thì service chết ngay
      - name: Wait for databases
        run: |
          wait_for() {
            name=$1; shift
            for i in $(seq 1 60); do
              # timeout 10: mỗi lần kiểm tra tối đa 10s, tránh lệnh bị treo (mongosh tự chờ ~30s khi chưa kết nối được)
              if timeout 10 "$@" > /dev/null 2>&1; then echo "$name ready"; return 0; fi
              sleep 3
            done
            echo "$name NOT ready after 180s"; return 1
          }
          wait_for SQLServer docker exec swiftride-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SwiftRide@123' -C -Q "SELECT 1"
          wait_for Postgres  docker exec swiftride-postgres pg_isready -U swiftride -d PayDb
          wait_for MongoDB   docker exec swiftride-mongodb mongosh --quiet --eval "db.runCommand({ping:1})"

      - name: Start services
        run: |
          mkdir -p logs
          nohup dotnet run --no-build -c Release --project src/TripService/TripService.Api       > logs/trip.log 2>&1 &
          nohup dotnet run --no-build -c Release --project src/MatchingService/MatchingService.Api > logs/matching.log 2>&1 &
          nohup dotnet run --no-build -c Release --project src/PaymentService/PaymentService.Api  > logs/payment.log 2>&1 &
          nohup dotnet run --no-build -c Release --project src/ApiGateway                         > logs/gateway.log 2>&1 &

      # Gọi GET /health của Gateway (gom /health của 3 service): 200 = cả 3 DB Healthy
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health; then echo; echo "All services healthy"; exit 0; fi
            sleep 2
          done
          echo "Health check failed:"
          curl -s http://localhost:5000/health || true
          exit 1

      - name: Service logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 30 sqlserver postgres
          docker logs --tail 30 swiftride-mongodb
          tail -n 50 logs/*.log || true

  frontend:
    name: Frontend (React build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
